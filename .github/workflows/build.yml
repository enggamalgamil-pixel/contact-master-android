name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "=== Node version ==="
          node -v
          echo "=== NPM version ==="
          npm -v
          echo "=== Java version ==="
          java -version
          echo "=== Files ==="
          ls -la
          echo "=== www folder ==="
          ls -la www

      - name: NPM init and install
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/contacts
          echo "=== Installed versions ==="
          cat package.json

      - name: NPM packages list
        run: ls -la node_modules/@capacitor/ || echo "no @capacitor folder"

      - name: Try cap init
        run: npx cap init "Contact Master Pro" "com.contactmaster.pro" --web-dir=www

      - name: Try cap add android
        run: npx cap add android
