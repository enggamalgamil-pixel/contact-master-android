name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Show available contacts versions
        run: npm view @capacitor/contacts versions --json | tail -20

      - name: Show available capacitor versions
        run: npm view @capacitor/core version

      - name: Install Capacitor latest
        run: |
          npm install @capacitor/core@latest
          npm install @capacitor/cli@latest
          npm install @capacitor/android@latest
          npm install @capacitor/contacts@latest

      - name: Show installed versions
        run: cat package.json

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Fix gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-master-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
