name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Init npm and install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Install contacts plugin
        run: npm install @capacitor/contacts

      - name: Verify contacts plugin
        run: |
          echo "=== Plugin installed? ==="
          ls -la node_modules/@capacitor/contacts/ || echo "NOT FOUND"
          cat package.json

      - name: Init Capacitor
        run: npx cap init "Contact Master Pro" "com.contactmaster.pro" --web-dir=www

      - name: Add Android platform
        run: npx cap add android

      - name: Patch AndroidManifest to add READ_CONTACTS
        run: |
          cd android/app/src/main
          echo "===== BEFORE ====="
          cat AndroidManifest.xml
          
          # إضافة صلاحية READ_CONTACTS إذا لم تكن موجودة
          if ! grep -q "android.permission.READ_CONTACTS" AndroidManifest.xml; then
            sed -i 's|<application|<uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.WRITE_CONTACTS" />\n    <uses-permission android:name="android.permission.GET_ACCOUNTS" />\n\n    <application|' AndroidManifest.xml
          fi
          
          echo "===== AFTER ====="
          cat AndroidManifest.xml

      - name: Patch variables.gradle for newer SDK
        run: |
          cd android
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' variables.gradle
          sed -i "s/androidxCoreVersion = .*/androidxCoreVersion = '1.15.0'/" variables.gradle
          sed -i "s|com.android.tools.build:gradle:.*'|com.android.tools.build:gradle:8.9.1'|" build.gradle
          sed -i 's|gradle-.*-all.zip|gradle-8.11.1-all.zip|' gradle/wrapper/gradle-wrapper.properties
          echo "===== variables.gradle ====="
          cat variables.gradle

      - name: Sync Android
        run: npx cap sync android

      - name: Show final manifest
        run: |
          echo "===== FINAL AndroidManifest ====="
          cat android/app/src/main/AndroidManifest.xml

      - name: Fix gradlew permission
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -100

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-master-apk-v2
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
