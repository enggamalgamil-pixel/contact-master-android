name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Init npm and install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Install contacts plugin
        run: npm install @capacitor/contacts || echo "contacts plugin install attempted"

      - name: Show Capacitor version
        run: npx cap --version

      - name: Init Capacitor
        run: npx cap init "Contact Master Pro" "com.contactmaster.pro" --web-dir=www

      - name: Add Android platform
        run: npx cap add android

      - name: Show Android files BEFORE patch
        run: |
          echo "===== variables.gradle ====="
          cat android/variables.gradle
          echo ""
          echo "===== build.gradle (top 30) ====="
          head -30 android/build.gradle
          echo ""
          echo "===== gradle-wrapper.properties ====="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Patch Android project for newer SDK
        run: |
          cd android
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/' variables.gradle
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 36/' variables.gradle
          sed -i "s/androidxCoreVersion = .*/androidxCoreVersion = '1.15.0'/" variables.gradle
          sed -i "s|com.android.tools.build:gradle:.*'|com.android.tools.build:gradle:8.9.1'|" build.gradle
          sed -i 's|gradle-.*-all.zip|gradle-8.11.1-all.zip|' gradle/wrapper/gradle-wrapper.properties
          echo "===== AFTER PATCH ====="
          cat variables.gradle
          echo ""
          head -30 build.gradle
          echo ""
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Sync Android
        run: npx cap sync android

      - name: Fix gradlew permission
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -100

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-master-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
